[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightingale-hoard"
version = "0.1.0"
description = "The data workbench for a local language model: ingest, clean, check, chart and model data — every step recorded, replayable and explained."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Luissalet" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "mcp>=1.10,<2",
  "duckdb>=1.1",
  "pandas>=2.2",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "pyarrow>=15",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "playwright>=1.45"]
forecast = ["statsmodels>=0.14"]

[project.scripts]
nightingale-hoard = "nightingale.__main__:main"

[tool.setuptools.packages.find]
include = ["nightingale*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
